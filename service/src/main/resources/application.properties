# The application config for qits-events as a standalone process.
#
# This module is the deployable, so this file is read at ordinal 250 and is the app's own settings —
# as opposed to a library jar's META-INF/microprofile-config.properties at ordinal 100, which is how
# `events` ships DEFAULTS it does not own the deployment of. Its datasource, persistence unit and
# Flyway lineage stay there; what a deployment supplies is the platform's generic resource triple,
# which those defaults expand:
#
#     QITS_RESOURCE_DB_URL / QITS_RESOURCE_DB_USERNAME / QITS_RESOURCE_DB_PASSWORD
#
# injected by qits-platform-deployments from the `resources: postgresql:db` line in
# .config/qits/deployments.yml. Any datasource key is still overridable by env on top of that.
#
# The tests read this file too — Quarkus merges src/test/resources/application.properties OVER it
# rather than replacing it — so everything below is in effect during the suite. That is deliberate:
# a test copy of an app-level key is free to drift from the shipped one, and then a green suite
# proves nothing about what actually starts.

quarkus.application.name=qits-events

# The JAX-RS prefix every qits route lives under: /<segment>/api, where the segment is this
# service's name without the qits- prefix. The edge path-routes VERBATIM by prefix on EVERY host —
# /events/* reaches qits-events with no rewriting, whichever vhost the request arrived on — so the
# leading segment is not decoration, it is what keeps this API reachable from a sibling's page too.
# Everything it serves hangs off it: /events/api/events. Drop or shorten it and every caller 404s.
quarkus.rest.path=/events/api

# Quarkus' non-application root path: what the framework serves rather than application code (the
# OpenAPI document, swagger-ui, health). It sits OUTSIDE quarkus.rest.path and moves only via this
# key, so without it /q/* stays at the root — which is the SPA's ground now, and the health gate
# would read index.html. The readiness probe the deployer curls is /events/q/health/ready, and it is
# this key that puts it there.
quarkus.http.non-application-root-path=/events/q

# --- a person's bearer token --------------------------------------------------------------------
# A person's command-line tool (`qits`, idp client `qits-cli`) reaches this service through the
# edge with that person's token. The edge strips every X-Qits-* header from a request that carries
# a Bearer or Basic credential and injects none, so forward-auth sees nothing and the request would
# be anonymous: 401 on every route. quarkus-oidc validates the token instead. Its `groups` claim
# becomes the identity's roles, so the same @RolesAllowed boundaries decide. The roles are the
# permission system.
#
# In-network callers do not change. They send X-Qits-User / X-Qits-Roles and no token, and a
# request with no Authorization header never reaches the token check: it falls through to
# forward-auth. A request WITH a token is decided by the token, because OIDC's mechanism runs first
# (priority 1001, forward-auth 1000): a token that does not validate is 401, headers or not.
#
# ON BY DEFAULT, so a deployment needs no config for it. It requires nothing and holds no secret; it
# only adds a way in. That is why it is not behind qits.auth.machine.required, which the deployer
# does not set for this service. Off in %dev and %test, which have no idp; the security/ tests turn
# it back on (BearerAuthProfile with a local key, JwksStub with a stand-in discovery and key endpoint).
quarkus.oidc.tenant-enabled=true
%dev.quarkus.oidc.tenant-enabled=false
%test.quarkus.oidc.tenant-enabled=false

# Bearer only: no login flow, no session.
quarkus.oidc.application-type=service

# Reached direct on qits-net. Discovery is on: the tenant reads
# <auth-server-url>/.well-known/openid-configuration and takes the JWKS address (`jwks_uri`) and
# the issuer from it.
#
# THE ENVIRONMENT IS PART OF THE ADDRESS, AND THE SERVICE ALREADY KNOWS IT. The idp is an ordinary
# service in the one environment now, deployed as ${QITS_ENVIRONMENT}-qits-platform-idp, and
# QITS_ENVIRONMENT is injected into every container by qits-deployments.
quarkus.oidc.auth-server-url=http://${QITS_ENVIRONMENT:dev}-qits-platform-idp:8080/idp

# THE ISSUER IS NOT CONFIGURATION. With discovery on, quarkus-oidc compares every token's `iss` to
# the `issuer` the idp publishes in its discovery document (https://idp.qits.<domain>), and refuses
# a token with any other. There is deliberately no quarkus.oidc.token.issuer line.

# FETCH KEYS WHEN A TOKEN NEEDS ONE, NEVER AT BOOT. The tenant reads the discovery document, not
# the JWKS, at start-up. The first bearer fetches the key by the token's `kid` (the idp sets one
# on every token), and it is cached (10 keys, 10 minutes). A new `kid` after the idp rotates its
# keys is fetched the same way. Header traffic and 401 challenges never fetch keys.
quarkus.oidc.jwks.resolve-early=false
# When the idp is down at boot, the tenant retries discovery when a request needs it. Resolve the
# idp's host name off the event loop: a resolution on the event loop was a 2.7 s blocked-thread
# warning in the packaged ITs (2026-09-12).
quarkus.oidc.use-blocking-dns-lookup=true

# Which tokens are for this platform. Quarkus 3.34.6 hands this to jose4j's AudValidator, which
# accepts a token whose `aud` holds `qits-platform` — the one platform-wide audience, carried by
# every token qits-platform-idp mints: a person's CLI token and a sibling's machine token alike. A
# token addressed to anything else is 401 before any role is read. It is a LITERAL and not an
# expression over another key: the audience is the platform's, not this service's, so there is no
# per-service value for it to follow. What a caller may then DO is decided by its roles, which is
# the whole of the permission system; being addressed to the platform is not a permission.
quarkus.oidc.token.audience=qits-platform

# --- the API document -------------------------------------------------------------------------
# Served at /events/q/openapi, with the browsable UI at /events/q/swagger-ui — both under
# quarkus.http.non-application-root-path above, not quarkus.rest.path. quarkus.swagger-ui.path is
# relative by default and follows automatically; do not pin it.
# always-include because swagger-ui is a dev-mode-only extension by default, and the point of
# packaging these as processes is that each documents its own surface in a real deployment.
quarkus.smallrye-openapi.info-title=qits-events API
quarkus.swagger-ui.always-include=true

# --- the web UI ---------------------------------------------------------------------------------
# The Angular SPA in service/src/main/webui — a submodule on qits-spa-events' own main, not a
# vendored copy. Quinoa runs its npm build during augmentation and registers the output as static
# resources, so one process serves the UI and the API and the gateway needs no second upstream.
#
# TWO THINGS THIS ADDS TO A BUILD, both part of this repo's clone-alone rule:
#   - the submodule has to be checked out. `git clone` alone leaves src/main/webui empty and Quinoa
#     then finds no package.json ("No package.json found in Web UI directory"); an uninitialised
#     gitlink is an empty directory, which is the one case Quinoa treats as a misconfiguration
#     rather than as "no client". `git submodule update --init` is part of a fresh clone here.
#   - an npm and a node have to be on PATH. The Angular CLI at 21 wants node ^20.19 || ^22.12 || >=24;
#     the platform's pin is 22.22.0, and the mandrel builder image in docker/Dockerfile ships no node
#     at all — which is why the two package-manager-install flags exist THERE and nowhere else.
# Neither reaches `./mvnw verify`: Quinoa is disabled in test mode by default, so the suite is green
# with an empty webui dir and no node at all. Only a `package` builds the UI.
#
# THE SPA IS SERVED AT THE ROOT. This service has a host of its own — events.<env>.<domain> — and
# the client owns every path on it that the wire routes below do not claim. Its baseHref is `/`, so
# the two sides agree by having nothing to agree about: no segment is spelled in the client at all.
#
# The segment survives in THREE keys that move together — this list's entry below,
# quarkus.rest.path and quarkus.http.non-application-root-path — plus `routes:` in
# .config/qits/deployments.yml, which is what tells the edge to path-route /events/* here from every
# vhost. Four spellings, all of them in this repository, all of them checkable by a build here.
quarkus.quinoa.ui-root-path=/

# Deep links. Without this a GET /some/route is a 404 from the static handler rather than the SPA's
# own route — the client only ever sees its router if index.html is what comes back for a path the
# build produced no file for. It is what makes `/qits/events/<id>` survive a reload.
quarkus.quinoa.enable-spa-routing=true

# Where Angular leaves the bundle, relative to the webui dir. `dist/<project>/browser` is the
# application builder's layout since Angular 17 (the browser/ level is where the SSR split put it).
# Quinoa's Angular detection can resolve this from the client's angular.json on its own; it is
# pinned anyway because the platform's style is to spell a value where its failure would land — the
# name in it is the SPA's package name, and a rename fails here loudly ("Quinoa build directory not
# found") instead of shipping an empty UI.
quarkus.quinoa.build-dir=dist/qits-spa-events/browser

# What SPA routing must NOT swallow. The re-route is a catch-all at /* registered near-last, so
# anything with a real route in front of it still wins — but a request matching NO route is rerouted
# to index.html and answers 200 text/html instead of 404. That is fine for a person, who gets the
# client's own not-found page, and wrong for a machine, which parses index.html as garbage data: the
# correct answer to a mistyped machine path is a 404.
#
# ONE ENTRY, and it is ABSOLUTE. The values are matched after ui-root-path is stripped, and the
# ui-root is `/` now, so what is written here is the path as it arrives. `/events` is a PREFIX
# match, so it covers /events/api, /events/q and /events/stream at once — everything this service
# owns hangs under the one segment.
#
# Quinoa DERIVES this list when the key is unset, from quarkus.rest.path and
# quarkus.http.non-application-root-path — /events/api and /events/q. That derivation was this
# service's complete machine surface and is no longer: /events/stream is a @WebSocket literal, which
# follows neither key. Setting the key REPLACES the derivation rather than extending it, which is
# why the one entry has to cover all three.
#
# THE TRAP that stays, measured on sibling services: websockets-next claims only the UPGRADE
# HANDSHAKE. A plain GET on a socket path — no Upgrade header, which is what a mistyped machine path
# or a curious browser sends — reaches no socket route at all and falls through to the SPA. Measured
# on qits-ci's daemon socket: 200 text/html with index.html, from a build that was green. Ignoring
# the prefix does NOT unregister the route; the upgrade still works, and PackagedSurfaceIT asserts
# both halves on the artifact.
#
#   /events/api     JAX-RS (quarkus.rest.path), including /events/api/stream — the SSE transport of
#                   the same fan-out (stream/EventStreamResource). It is a JAX-RS @Path, so it
#                   follows quarkus.rest.path and needed NOTHING added here; the prefix above
#                   already covers it. That is exactly why the address is under /api rather than
#                   beside the socket's literal. It is also the surface most exposed to the trap
#                   below: a plain GET with no upgrade to tell it from a page request.
#   /events/q       openapi, swagger-ui, health (quarkus.http.non-application-root-path)
#   /events/stream  the event stream socket (@WebSocket, stream/EventStreamSocket)
quarkus.quinoa.ignored-path-prefixes=/events

# quarkus.quinoa.package-manager-install is deliberately ABSENT and must stay absent. A local or CI
# `mvnw` build uses the node on PATH, so no build silently downloads a toolchain; the two install
# flags live in exactly one place, docker/Dockerfile's build stage, because the Mandrel builder image
# ships no node. A machine with no node fails at Quinoa's npm invocation — that is the intended
# failure, and the fix is node on PATH, not this key.

# --- the packaged artifact ----------------------------------------------------------------------
# Name the build output `qits-events` rather than qits-events-service-<version>-runner, so
# `-Dnative` produces target/qits-events and the process is identifiable in `ps` / `docker top`.
# The failsafe plugin's native.image.path in service/pom.xml spells the same name; the two are the
# same string in two files and move together — with an output-name set,
# ${project.build.finalName}-runner is a path that does not exist, so a native IT that disagrees
# launches nothing and passes.
quarkus.package.output-name=qits-events
quarkus.package.jar.add-runner-suffix=false

# --- telemetry --------------------------------------------------------------------------------
# One key names the receiver: qits.observability.url — scheme, host and port, NO path. The ingest
# path is qits-observability's own and belongs to that service, not to this deployment, so it is
# spelled once here and derived rather than configured. Point this at a collector or a different
# host and everything below follows.
qits.observability.url=http://${QITS_ENVIRONMENT:dev}-qits-observability:8080

# http/protobuf, not the gRPC default: the receiver is an HTTP resource, and the exporter appends
# /v1/<signal> to this base — so this resolves to the three ingest routes at
# /observability/api/otel/v1/{traces,logs,metrics}.
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.exporter.otlp.endpoint=${qits.observability.url}/observability/api/otel

# Logs ride the same exporter; traces are on by default. The receiver decodes all three signals, and
# a log record correlated to a trace is most of why the receiver exists.
#
# THE THREE KEYS BELOW ARE SPELLED OUT ON PURPOSE. Quarkus still labels its OpenTelemetry logging
# integration PREVIEW, and the whole of what ships application logs to qits-observability is the
# handler this enables — so an upgrade that changed one of these defaults would stop the platform's
# logging with a green build and no error anywhere. Written down, a change of default is a diff
# rather than a silence. Measured against Quarkus 3.34.6's own config classes rather than recalled:
#
#   quarkus.otel.logs.handler.enabled  default true  (LogsRuntimeConfig.handlerEnabled)
#   quarkus.otel.logs.exporter         default cdi   (LogsBuildConfig.exporter)
#   quarkus.otel.logs.level            default ALL   (LogsRuntimeConfig.level)
#
# `cdi` is what routes the records at the exporter configured above rather than at a second,
# separately-configured one; `handler.enabled` is the JBoss Log Manager handler that turns an
# ordinary org.jboss.logging.Logger call into an OTLP record, and without it the other two keys
# describe a pipe nothing enters.
#
# The level is the ONE line here that is not the shipped default: Quarkus exports every record the
# log manager creates, and this makes INFO the outbound floor. Per-category quarkus.log levels still
# decide which records exist at all; this is a second gate on the way out, so that what leaves the
# process is a deliberate amount rather than whatever a debug category happens to emit. Console
# logging is untouched by all of it — the OTel handler is an ADDITIONAL copy, never the only one,
# which is what keeps a container's stdout the durable-at-host fallback when the receiver is down.
#
# OtelLogBridgeTest proves this arrangement end to end against a decoded ExportLogsServiceRequest,
# and PackagedLogBridgeIT repeats it against the packaged artifact, where the handler's build-time
# initialisation is a different question.
quarkus.otel.logs.enabled=true
quarkus.otel.logs.handler.enabled=true
quarkus.otel.logs.exporter=cdi
quarkus.otel.logs.level=INFO

# Metrics ride it too. Off by default in Quarkus, so without this line the third signal never
# leaves — the receiver has always decoded it, and the observability UI has nothing to plot until
# every service says this.
quarkus.otel.metrics.enabled=true

# Dark outside a deployment. A clone-alone `./mvnw verify` and a `quarkus:dev` have no
# qits-observability to reach, and an exporter retrying against an unresolvable host turns every
# suite into a wall of export failures. The deployment is where telemetry is real.
%dev.quarkus.otel.sdk.disabled=true
%test.quarkus.otel.sdk.disabled=true
