archetype: java-service
artifacts:
  - { type: docker, name: qits/qits-events, sbom: .sbom/sbom.json }
# The provider golden masters (epic qits-112): the platform packages `golden-masters/` as
# `eu.wohlben.qits:qits-events-golden-masters` and `@qits/events-golden-masters`, each published
# only when its content changed. `GoldenMasterRecordingTest` records them.
contracts:
  application: qits-events
  golden-masters: { from: golden-masters/, packages: [maven, npm] }
  # The consumer pacts this service writes (ticket qits-1149): IdpConsumerPactTest writes
  # pacts/qits-events-service_qits-idp-service.json.
  pacts:
    qits-idp-service: { packages: [maven] }
# THE SITE IS SPELLED, AND IT NAMES THE COMPONENT. `true` derives it from the REPOSITORY name,
# which would put the retired tier modifier in a storage id and then MOVE that id the day the
# repository is renamed — a bundle's history stranded under a name nothing publishes to any
# more. Every other service on the estate already spells the component (@userflows/qits-ci,
# @userflows/qits-projects, @userflows/qits-observability); `true` survived only here, where the
# derived value happened to be tolerable. Spelled, the rename costs the bundle nothing.
userflows: qits-events
